name: Daily health check
on:
  schedule:
    - cron: '30 19 * * *'   # 07:30 or 08:30 in New Zealand, every day
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the dashboard whether its connections and sales codes are healthy
        run: |
          code=$(curl -sS --max-time 150 -o health.json -w '%{http_code}' https://worthy-digital-dashboard.vercel.app/api/cron/health || echo 000)
          echo "HTTP $code"; cat health.json 2>/dev/null | head -c 4000; echo
          if [ "$code" != "200" ]; then
            echo "::warning title=Health check could not run::The dashboard answered HTTP $code. It will try again tomorrow."
            exit 0
          fi
          # Fails (and GitHub emails the owner) when any check failed; each failed check is listed.
          if grep -q '"attention":true' health.json; then
            failed=$(python3 -c "import json; print(' | '.join(json.load(open('health.json')).get('failed', [])))" 2>/dev/null || echo 'see the answer above')
            echo "::error title=Dashboard health check failed::$failed. What each check means and how to fix it: docs/HEALTH.md."
            exit 1
          fi
