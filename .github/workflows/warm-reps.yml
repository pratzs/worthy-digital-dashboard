name: Keep rep figures warm
on:
  schedule:
    # Every 20 minutes from 04:00 to 20:00 New Zealand time, every day (UTC hours 15 to 23 and 0 to 8 cover both
    # summer and winter time), so a rep's first question of the day is quick.
    - cron: '*/20 15-23,0-8 * * *'
  workflow_dispatch:

# One warm-up at a time, so it never piles more work onto Odoo or Ostendo.
concurrency:
  group: warm-reps
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh every rep's own figures
        run: |
          # A slow or failed warm-up is not an emergency: the next run carries on. It is recorded as a warning
          # instead of failing the job, so it does not send a failure email every 20 minutes.
          code=$(curl -sS --max-time 320 -o warm.json -w '%{http_code}' https://worthy-digital-dashboard.vercel.app/api/cron/warm-reps || echo 000)
          echo "HTTP $code"
          cat warm.json 2>/dev/null | head -c 1500 || true
          echo
          if [ "$code" != "200" ]; then
            echo "::warning title=Rep warm-up did not complete::The dashboard answered HTTP $code. The next run will continue."
          fi
          exit 0
